<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Вход — Sergek Dent</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .box { width: min(400px, 100%); background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 32px 28px; box-shadow: var(--shadow); }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
  h1 { font-size: 20px; font-weight: 600; margin: 18px 0 4px; }
  p.hint { margin-bottom: 22px; }
</style>
</head>
<body>
<main class="box">
  <div class="top">
    <div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6F8BFF"/><stop offset="1" stop-color="#2F4BFF"/></linearGradient></defs><circle cx="16" cy="16" r="16" fill="url(#lg)"/><path d="M16 9.5c-1.7-1.4-5.7-1.7-6.5 1.9-.5 2.3.7 4 1.2 6.3.5 2.4.6 5.3 2.2 5.3 1.7 0 1.4-3.2 3.1-3.2s1.4 3.2 3.1 3.2c1.6 0 1.7-2.9 2.2-5.3.5-2.3 1.7-4 1.2-6.3-.8-3.6-4.8-3.3-6.5-1.9z" fill="#fff"/></svg>Sergek Dent</div>
    <div id="lang"></div>
  </div>
  <h1 data-i18n="Вход для сотрудников">Вход для сотрудников</h1>
  <p class="hint" data-i18n="Владелец, администратор и врач">Владелец, администратор и врач</p>
  <form id="form" novalidate>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password" data-i18n="Пароль">Пароль</label><input id="password" type="password" autocomplete="current-password" required></div>
    <div class="field hidden" id="codeBox"><label for="code" data-i18n="Код из приложения">Код из приложения</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
    <p class="error" id="error" role="alert"></p>
    <button class="btn block" id="submit" data-i18n="Войти">Войти</button>
  </form>
</main>
<script src="/assets/common.js"></script>
<script src="/assets/i18n.js"></script>
<script>
  const { $, api, t } = SG;
  SG.langSwitcher($("#lang"));
  $("#form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("#error").textContent = ""; $("#submit").disabled = true;
    try {
      const r = await api("/api/auth/login", { method: "POST", body: { email: $("#email").value, password: $("#password").value, code: $("#code").value } });
      location.replace(r.redirect);
    } catch (ex) {
      if (ex.data?.needCode) {
        $("#codeBox").classList.remove("hidden"); $("#code").focus();
        $("#error").textContent = $("#code").value ? t("Неверный код") : t("Введите код из приложения-аутентификатора");
      } else {
        $("#error").textContent = ex.status === 429 ? t("Слишком много попыток. Попробуйте позже.") : t("Неверный email или пароль");
      }
      $("#submit").disabled = false;
    }
  });
</script>
</body>
</html>
