<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sergek Dent — админ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/ui.css">
<style>
  /* Мобильная админка: одна колонка, нижняя навигация, записи карточками вместо таблицы. */
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  .wrap { padding: 14px 14px 0; max-width: 720px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
  .me { display: flex; align-items: center; gap: 8px; }
  .me .avatar { width: 36px; height: 36px; font-size: 12px; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 12px; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .stat { border: 1px solid var(--line); border-radius: var(--r-card); padding: 14px; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between; background: #fff; }
  .stat span { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .stat b { font-size: 32px; font-weight: 600; line-height: 1; }

  .search { position: relative; margin-bottom: 12px; }
  .search input { width: 100%; background: #fff; border-radius: var(--r-ctl); padding: 12px 40px 12px 14px; border: 1px solid var(--field-line); font-size: 16px; outline: none; }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
  .search .ic { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .seg { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; scrollbar-width: none; }

  .appt { display: block; width: 100%; text-align: left; margin-bottom: 10px; padding: 14px; }
  .appt .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .appt .when { font-weight: 600; }
  .appt .who { margin-top: 6px; font-weight: 500; }
  .appt .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .more { margin: 6px 0 16px; }
  .person { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .person .avatar { width: 38px; height: 38px; font-size: 12px; }
  .person a { margin-left: auto; color: inherit; padding: 10px; }

  nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); z-index: 20; }
  nav.tabbar button { display: grid; justify-items: center; gap: 3px; padding: 8px 4px; font-size: 10px; color: var(--muted); min-height: 48px; border-radius: 12px; }
  nav.tabbar button.on { color: var(--accent); font-weight: 600; }
  .fab { position: fixed; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 20px rgba(47,75,255,.35); z-index: 21; transition: transform .2s var(--ease); }
  .fab:active { transform: scale(.94); }
  .fab .ic { width: 24px; height: 24px; }
  .list-item { display: flex; align-items: center; justify-content: space-between; padding: 16px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6F8BFF"/><stop offset="1" stop-color="#2F4BFF"/></linearGradient></defs><circle cx="16" cy="16" r="16" fill="url(#lg)"/><path d="M16 9.5c-1.7-1.4-5.7-1.7-6.5 1.9-.5 2.3.7 4 1.2 6.3.5 2.4.6 5.3 2.2 5.3 1.7 0 1.4-3.2 3.1-3.2s1.4 3.2 3.1 3.2c1.6 0 1.7-2.9 2.2-5.3.5-2.3 1.7-4 1.2-6.3-.8-3.6-4.8-3.3-6.5-1.9z" fill="#fff"/></svg>Sergek Dent</div>
    <div class="me"><span class="hint" id="meRole"></span><div class="avatar" id="meAvatar"></div></div>
  </header>

  <!-- Сводка -->
  <section id="v-home">
    <h1>Сводка</h1>
    <div class="stats">
      <div class="stat"><span>Записей сегодня</span><b data-stat="appointmentsToday">–</b></div>
      <div class="stat"><span>На приёме</span><b data-stat="inProgress">–</b></div>
      <div class="stat"><span>Пациентов</span><b data-stat="clients">–</b></div>
      <div class="stat"><span>Врачей</span><b data-stat="masters">–</b></div>
    </div>
    <h1>Ближайшие записи</h1>
    <div id="soon"></div>
  </section>

  <!-- Записи -->
  <section id="v-appts" class="hidden">
    <h1>Записи</h1>
    <label class="search"><span class="sr-only">Поиск</span><input id="q" type="search" placeholder="Пациент, зуб, телефон или услуга" autocomplete="off"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></label>
    <div class="seg" id="seg">
      <button class="chip on" data-tab="upcoming">Предстоящие</button><button class="chip" data-tab="all">Все</button><button class="chip" data-tab="cancelled">Отменённые</button>
    </div>
    <div id="list"></div>
    <button class="btn ghost block more hidden" id="more">Показать ещё</button>
  </section>

  <!-- Пациенты -->
  <section id="v-clients" class="hidden">
    <h1>Пациенты</h1>
    <label class="search"><span class="sr-only">Поиск пациента</span><input id="cq" type="search" placeholder="Имя, телефон или зуб" autocomplete="off"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></label>
    <div id="clients"></div>
  </section>

  <!-- Ещё -->
  <section id="v-more" class="hidden">
    <h1>Ещё</h1>
    <button class="card list-item" id="tg" style="width:100%">Подключить Telegram <span class="hint" id="tgState"></span></button>
    <a class="card list-item" id="pub" href="#" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Страница онлайн-записи <span class="hint">открыть</span></a>
    <a class="card list-item" href="./index.html?desktop=1" style="text-decoration:none;color:inherit">Полная версия <span class="hint">для компьютера</span></a>
    <button class="card list-item" id="logout" style="width:100%;color:var(--danger)">Выйти</button>
  </section>
</div>

<button class="fab" id="newAppt" aria-label="Новая запись"><svg class="ic" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>

<nav class="tabbar" aria-label="Разделы">
  <button class="on" data-view="home"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Сводка</button>
  <button data-view="appts"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Записи</button>
  <button data-view="clients"><svg class="ic" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Пациенты</button>
  <button data-view="more"><svg class="ic" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>Ещё</button>
</nav>

<script src="./assets/common.js"></script>
<script src="./assets/booking-dialog.js"></script>
<script>
  const { $, $$, esc, api, toast, fmtTime, fmtDay, statusChip, money } = SG;
  // На широком экране показываем полную версию.
  if (matchMedia("(min-width: 1000px)").matches && !location.search.includes("mobile")) location.replace("./index.html");
  const toLogin = () => location.replace("./login.html");
  const get = (u) => api(u, { on401: toLogin });
  const state = { tab: "upcoming", page: 1, q: "" };
  let byId = {}, clients = [];

  function card(a) {
    byId[a.id] = a;
    return `<button class="card appt" data-id="${a.id}">
      <div class="top"><span class="when">${esc(fmtDay(a.startsAt))}, ${fmtTime(a.startsAt)}–${fmtTime(a.endsAt)}</span>${statusChip(a.status)}</div>
      <div class="who">${esc(a.clientName)}</div>
      ${a.toothName ? `<div class="meta" style="color:var(--ink)">${esc(a.toothName)} <span class="dx">${esc(a.toothDiagnosis)}</span></div>` : ""}
      <div class="meta">${esc(a.services)} · ${esc(a.masterName)} · ${money(a.priceTenge)}</div></button>`;
  }

  async function loadHome() {
    const [s, soon] = await Promise.all([get("/api/staff/dashboard"), get("/api/staff/appointments?tab=upcoming&pageSize=5")]);
    $$("[data-stat]").forEach((el) => (el.textContent = s[el.dataset.stat] ?? 0));
    $("#soon").innerHTML = soon.items.length ? soon.items.map(card).join("") : `<p class="empty">Предстоящих записей нет</p>`;
  }

  async function loadAppts(append = false) {
    const qs = new URLSearchParams({ tab: state.tab, page: state.page, pageSize: 10, q: state.q });
    const r = await get("/api/staff/appointments?" + qs);
    const html = r.items.map(card).join("");
    $("#list").innerHTML = append ? $("#list").innerHTML + html : html || `<p class="empty">Ничего не найдено</p>`;
    $("#more").classList.toggle("hidden", state.page * 10 >= r.total);
  }

  async function loadClients() {
    if (!clients.length) clients = await get("/api/staff/clients");
    const q = $("#cq").value.trim().toLowerCase();
    const shown = clients.filter((c) => !q || c.fullName.toLowerCase().includes(q) || c.phone.includes(q));
    $("#clients").innerHTML = shown.map((c) => `<div class="card person"><div class="avatar">${esc(SG.initials(c.fullName))}</div><div><b style="font-weight:500">${esc(c.fullName)}</b><br><span class="hint">${esc(c.phone)}</span></div><a href="tel:${esc(c.phone)}" aria-label="Позвонить"><svg class="ic" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></a></div>`).join("") || `<p class="empty">Никого не найдено</p>`;
  }

  const refresh = () => { loadHome(); if (!$("#v-appts").classList.contains("hidden")) { state.page = 1; loadAppts(); } };

  /* Нижняя навигация */
  $$("nav.tabbar button").forEach((b) => b.addEventListener("click", () => {
    $$("nav.tabbar button").forEach((x) => x.classList.toggle("on", x === b));
    ["home", "appts", "clients", "more"].forEach((v) => $("#v-" + v).classList.toggle("hidden", v !== b.dataset.view));
    $("#newAppt").classList.toggle("hidden", b.dataset.view === "more");
    if (b.dataset.view === "home") loadHome();
    if (b.dataset.view === "appts") { state.page = 1; loadAppts(); }
    if (b.dataset.view === "clients") loadClients();
    scrollTo(0, 0);
  }));

  $("#seg").addEventListener("click", (e) => {
    const c = e.target.closest("[data-tab]"); if (!c) return;
    $$("#seg .chip").forEach((x) => x.classList.toggle("on", x === c));
    state.tab = c.dataset.tab; state.page = 1; loadAppts();
  });
  let t; $("#q").addEventListener("input", (e) => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value.trim(); state.page = 1; loadAppts(); }, 250); });
  $("#cq").addEventListener("input", loadClients);
  $("#more").onclick = () => { state.page++; loadAppts(true); };

  document.addEventListener("click", (e) => {
    const c = e.target.closest(".appt"); if (!c) return;
    SG.openStatusDialog({ appt: byId[c.dataset.id], endpoint: (id) => `/api/staff/appointments/${id}`, payEndpoint: (id) => `/api/staff/appointments/${id}/pay`, onChanged: refresh, on401: toLogin });
  });
  $("#newAppt").onclick = () => SG.openBookingDialog({ onCreated: refresh, on401: toLogin }).catch((e) => toast(e.message));
  $("#logout").onclick = async () => { await api("/api/auth/logout", { method: "POST" }); toLogin(); };

  get("/api/staff/telegram").then((t) => {
    if (!t.enabled) return $("#tg").classList.add("hidden");
    if (t.linked) $("#tgState").textContent = "подключено";
    $("#tg").onclick = async () => { const r = await api("/api/staff/telegram/link", { method: "POST", body: {}, on401: toLogin }); window.open(r.url, "_blank", "noopener"); toast("Нажмите Start в Telegram"); };
  }).catch(() => {});
  get("/api/auth/me").then((m) => { $("#pub").href = `/b/${m.salonSlug}`; $("#meAvatar").textContent = SG.initials(m.name); $("#meRole").textContent = m.role === "owner" ? "Владелец" : "Админ"; });
  loadHome().catch((e) => toast(e.message));
</script>
</body>
</html>
